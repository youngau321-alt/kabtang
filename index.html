*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}

h1{font-size:1.9rem;font-weight:800;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input[type="file"]{padding:7px 9px;font-size:.88rem}
input:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--main);outline-offset:1px}
.f{flex:1;min-width:120px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 14px}
button.p{background:var(--main);border-color:var(--main);color:#fff;font-weight:600}
button.install{background:var(--main);border-color:var(--main);color:#fff;font-weight:600;padding:8px 13px;font-size:.9rem}

.big{font-size:2.2rem;font-weight:800;line-height:1.1}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--main);transition:width .3s}
.stats{display:flex;gap:24px;flex-wrap:wrap;color:var(--mute);font-size:.92rem}
.stats b{color:var(--ink)}
.item{padding:12px 0;border-top:1px solid var(--line)}

.top{display:flex;align-items:center;gap:12px}
.nm{flex:1;min-width:0}

.nm .rk{display:block}
.tag{font-size:.82rem;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-over{color:var(--over)}
.acts{display:flex;gap:6px}
.acts button{padding:6px 10px;font-size:.88rem}
details{margin-top:8px}
summary{cursor:pointer;color:var(--mute);font-size:.88rem}
.h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;font-size:.92rem;border-bottom:1px dashed var(--line)}
.h:last-child{border-bottom:0}

.slip-thumb{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;flex:0 0 auto}

.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:.85rem}

<script>
// สร้าง Web App Manifest และ Service Worker อัตโนมัติเพื่อให้ติดตั้งเป็นแอปได้ในไฟล์เดียว
(function setupPWA(){
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#1f6f5c"/><text x="96" y="122" font-size="84" text-anchor="middle" fill="#ffffff">🏠</text></svg>`;
  const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(iconSvg)));

  const appleLink = document.createElement('link');
  appleLink.rel = 'apple-touch-icon';
  appleLink.href = iconUrl;
  document.head.appendChild(appleLink);

  const manifest = {
    name: 'เก็บค่าห้อง',
    short_name: 'เก็บค่าห้อง',
    start_url: './',
    scope: './',
    display: 'standalone',
    background_color: '#121816',
    theme_color: '#1f6f5c',
    icons: [{ src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' }]
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = URL.createObjectURL(manifestBlob);
  document.head.appendChild(manifestLink);

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    const swCode = `
      const CACHE_NAME = 'rent-tracker-pwa-v13';
      self.addEventListener('install', e => {
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        if (e.request.method !== 'GET') return;
        const url = new URL(e.request.url);
        if (url.hostname.includes('firebasedatabase.app')) return;
        e.respondWith(
          fetch(e.request).then(res => {
            if (res && res.status === 200 && url.origin === location.origin){
              const copy = res.clone();
              caches.open(CACHE_NAME).then(c => c.put(e.request, copy));
            }
            return res;
          }).catch(() => caches.match(e.request))
        );
      });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }
})();

let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.style.display = 'inline-block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});

<script>

const RANK_BY = 'total';
const RANK_UNIT = RANK_BY === 'months' ? 'เดือน' : 'บาท';
const RANKS = [
  { min: 0,    name: 'ยาจก',    icon: '🥀', color: '#6b7a73' },
  { min: 200,  name: 'ขอทาน',   icon: '🪙', color: '#92400e' },

];
function personScore(id){
  let s = 0;
  Object.entries(state.pay || {}).forEach(([m, byId]) => {
    const paid = (((byId || {})[id]) || []).reduce((t, x) => t + (Number(x && x.a) || 0), 0);
    const rent = (state.rents && state.rents[m] !== undefined) ? state.rents[m] : state.rent;
    if (RANK_BY === 'total') s += paid;
    else if (rent > 0 && paid >= rent) s += 1;
  });
  return s;
}
function rankOf(score){
  let i = 0;
  RANKS.forEach((r, k) => { if (score >= r.min) i = k; });
  return { cur: RANKS[i], next: RANKS[i+1] || null };
}

const BACKGROUND = {
  light: '#f3f6f4',
  dark:  '#121816',
  image: '833172029_1087972224142531_5479026980495393506_n.jpg',
};
function applyBackground(){
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const color = dark ? BACKGROUND.dark : BACKGROUND.light;
  document.body.style.background = BACKGROUND.image
    ? 'url("' + BACKGROUND.image + '") center / cover fixed no-repeat, ' + color

}
if (window.matchMedia) {

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const nowMonth = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const fmt = n => Number(n || 0).toLocaleString('th-TH');
const monthLabelTH = m => {
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, (mo || 1) - 1, 1).toLocaleDateString('th-TH', { month:'long', year:'numeric' });
};

function playBeep(){
  if (!soundEnabled) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(784, ctx.currentTime);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.26);
  } catch(e){}
}

function showToast(title, body){
  const wrap = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<b></b><span></span>';
  el.querySelector('b').textContent = title;
  el.querySelector('span').textContent = body;
  wrap.appendChild(el);
  playBeep();
  setTimeout(() => { el.remove(); }, 6500);
}

function compressImage(file, maxWidth = 600, quality = 0.65){
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    if (file.type && !file.type.startsWith('image/')) return reject(new Error('กรุณาเลือกไฟล์รูปภาพ'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์รูปไม่สำเร็จ'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('โหลดรูปไม่สำเร็จ'));
      img.onload = () => {
        let w = img.width || maxWidth, h = img.height || maxWidth;
        if (w > maxWidth){
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function extractAmountFromText(rawText){
  if (!rawText) return null;
  const cleaned = rawText
    .replace(/บาท|THB|฿|จำนวนเงิน|ยอดโอน|ยอดเงิน/gi, ' ')
    .replace(/O(?=\d)/g, '0')
    .replace(/(?<=\d)O/g, '0');
  const matches = [...cleaned.matchAll(/\b(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{1,2}))?\b/g)];
  const candidates = [];
  for (const m of matches){
    const intPart = Number(m[1].replace(/,/g, ''));
    const decPart = m[2] ? Number('0.' + m[2]) : 0;
    const val = intPart + decPart;
    if (val > 0 && val < 1000000){
      const isPlainYear = !m[1].includes(',') && !m[2] && val >= 2500 && val <= 2575;
      candidates.push({ val, isPlainYear, hasDecimalOrComma: Boolean(m[2] || m[1].includes(',')) });
    }
  }
  if (!candidates.length) return null;
  const filtered = candidates.filter(c => !c.isPlainYear);
  const pool = filtered.length ? filtered : candidates;
  const decimalPool = pool.filter(c => c.hasDecimalOrComma);
  const best = (decimalPool.length ? decimalPool : pool).sort((a, b) => b.val - a.val)[0];
  return Number.isInteger(best.val) ? best.val : Number(best.val.toFixed(2));
}

async function readSlipAmount(dataUrl, hintEl, amtInput){
  if (!window.Tesseract || !dataUrl) return;
  hintEl.textContent = 'กำลังอ่านยอดเงินจากสลิป...';
  try {
    const res = await window.Tesseract.recognize(dataUrl, 'tha+eng');
    const txt = (res && res.data && res.data.text) || '';
    const amount = extractAmountFromText(txt);
    if (amount !== null && amount > 0){
      amtInput.value = amount;
      hintEl.textContent = 'อ่านยอดจากสลิปได้ ' + fmt(amount) + ' บาท (แก้ได้)';
    } else {
      hintEl.textContent = 'อ่านยอดอัตโนมัติไม่ชัด กรุณากรอกยอดเงินเอง';
    }
  } catch(e){
    hintEl.textContent = 'อ่านสลิปไม่สำเร็จ กรุณากรอกยอดเงินเอง';
  }
}

function openLightbox(src){
  if (!src) return;
  $('lightboxImg').src = src;
  $('lightbox').classList.add('open');
}
$('lightbox').addEventListener('click', () => $('lightbox').classList.remove('open'));

function normalize(s){
  s = (s && typeof s === 'object') ? s : {};
  const out = { rent: Number(s.rent) || 0, rents: (s.rents && typeof s.rents === 'object') ? s.rents : {}, month: s.month || '', people: [], pay: {} };
  const ppl = Array.isArray(s.people) ? s.people.filter(Boolean) : Object.values(s.people || {}).filter(Boolean);
  const m = out.month || nowMonth();
  ppl.forEach(p => {
    const id = p.id || uid();
    out.people.push({ id, name: String(p.name || '') });
    if (p.paid > 0 && !p.id){
      out.pay[m] = out.pay[m] || {};
      out.pay[m][id] = [{ a: Number(p.paid), t: Date.now() }];
    }
  });
  Object.entries(s.pay || {}).forEach(([mo, byId]) => {
    if (!byId || typeof byId !== 'object') return;
    out.pay[mo] = out.pay[mo] || {};
    Object.entries(byId).forEach(([id, arr]) => {
      const list = Array.isArray(arr) ? arr : Object.values(arr || {});
      out.pay[mo][id] = list.filter(Boolean).map(item => ({
        a: Number(item && item.a) || 0,
        t: Number(item && item.t) || Date.now(),
        ...(item && item.img ? { img: String(item.img) } : {})
      }));
    });
  });
  return out;
}

function load(){
  try {
    const s = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);
    if (s) state = normalize(JSON.parse(s));
  } catch(e){}
  if (!state.month) state.month = nowMonth();
}

let dirty = 0;
function errMsg(e){
  if (e === 401 || e === 403) return 'Firebase ไม่อนุญาต (' + e + ') ไปตั้ง Rules ให้ read/write เป็น true';
  if (e === 404) return 'ไม่พบฐานข้อมูล ตรวจลิงก์ DB_URL';
  return 'ออนไลน์ไม่ได้ (' + ((e && e.message) || e) + ')';
}
function setStatus(t){ $('status').textContent = t; }

function notifyNewPayments(prevState, nextState){
  if (!initializedStream) return;
  const pplMap = new Map((nextState.people || []).map(p => [p.id, p.name]));
  const allMonths = new Set([...Object.keys(prevState.pay || {}), ...Object.keys(nextState.pay || {})]);

  allMonths.forEach(m => {
    const prevById = (prevState.pay && prevState.pay[m]) || {};
    const nextById = (nextState.pay && nextState.pay[m]) || {};
    const rent = (nextState.rents && nextState.rents[m] !== undefined) ? nextState.rents[m] : nextState.rent;

    Object.entries(nextById).forEach(([id, nextArr]) => {
      const prevArr = prevById[id] || [];
      const prevSum = prevArr.reduce((s, x) => s + (Number(x && x.a) || 0), 0);
      const nextSum = (nextArr || []).reduce((s, x) => s + (Number(x && x.a) || 0), 0);
      if (nextSum > prevSum){
        const added = nextSum - prevSum;
        const name = pplMap.get(id) || 'สมาชิก';
        const fullText = (rent > 0 && nextSum >= rent) ? ' · จ่ายครบเดือนนี้แล้ว!' : '';
        showToast(
          'มีการจ่ายเงินใหม่ (' + monthLabelTH(m) + ')',
          name + ' จ่ายเพิ่ม +' + fmt(added) + ' บาท (รวมเดือนนี้ ' + fmt(nextSum) + ' บาท)' + fullText
        );
      }
    });
  });
}

function applyRemoteData(d){
  if (!d || d.error) return;
  const n = normalize(d);
  n.month = state.month;
  const prevSnapshot = JSON.parse(JSON.stringify(state));
  if (JSON.stringify(n) !== JSON.stringify(normalize(state))){
    notifyNewPayments(prevSnapshot, n);
    state = n;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
    render();
  }
  initializedStream = true;
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ alert('พื้นที่เก็บข้อมูลในเบราว์เซอร์เต็ม อาจเกิดจากรูปที่แนบมีขนาดใหญ่เกินไป'); }
  if (!DB_URL) return;
  dirty++;
  setStatus('กำลังบันทึกเรียลไทม์...');
  fetch(DB_URL + DB_PATH, {
    method:'PUT',
    cache:'no-store',
    body: JSON.stringify(state)
  })
    .then(r => { if (!r.ok) throw r.status; setStatus('เรียลไทม์: บันทึกล่าสุดแล้ว'); })
    .catch(e => setStatus(errMsg(e)))
    .finally(() => { dirty = Math.max(0, dirty - 1); });
}

async function pull(force = false){
  if (!DB_URL || (dirty > 0 && !force)) return;
  try {
    const sep = DB_PATH.includes('?') ? '&' : '?';
    const r = await fetch(DB_URL + DB_PATH + sep + '_t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw r.status;
    const d = await r.json();
    if (dirty > 0 && !force) return;
    if (d && !d.error){
      applyRemoteData(d);
      render();
    } else if (!d && state.people.length){
      initializedStream = true;
      save();
      return;
    } else {
      initializedStream = true;
    }
    const nowTime = new Date().toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    setStatus('เรียลไทม์ออนไลน์อยู่ · ซิงก์ล่าสุด ' + nowTime);
  } catch(e){ setStatus(errMsg(e)); }
}

function startRealtimeStream(){
  if (!DB_URL || typeof EventSource === 'undefined') return;
  try {
    const es = new EventSource(DB_URL + DB_PATH);
    es.addEventListener('put', ev => {
      if (dirty > 0) return;
      try {
        const payload = JSON.parse(ev.data);
        if (payload.path === '/'){
          applyRemoteData(payload.data);
        } else {
          pull();
        }
      } catch(e){}
    });
    es.addEventListener('patch', () => {
      if (dirty <= 0) pull();
    });
  } catch(e){}
}

const curRent = () => (state.rents && state.rents[state.month] !== undefined) ? state.rents[state.month] : state.rent;
const pays = id => (((state.pay || {})[state.month] || {})[id]) || [];
const paidOf = id => pays(id).reduce((s, x) => s + (Number(x && x.a) || 0), 0);
const rentOf = m => (state.rents && state.rents[m] !== undefined) ? state.rents[m] : state.rent;
const paidIn = (m, id) => ((((state.pay || {})[m] || {})[id]) || []).reduce((s, x) => s + (Number(x && x.a) || 0), 0);
function nextM(m){ const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function creditIn(id, month){
  const ms = Object.keys(state.pay || {}).filter(m => paidIn(m, id) > 0).sort();
  if (!ms.length || ms[0] >= month) return 0;
  let c = 0, m = ms[0], n = 0;
  while (m < month && n++ < 600){ c = Math.max(0, c + paidIn(m, id) - rentOf(m)); m = nextM(m); }
  return c;
}
const totalOf = id => paidOf(id) + creditIn(id, state.month);
function addPay(id, a, img = ''){
  const m = state.month;
  state.rents[m] = (state.rents[m] !== undefined) ? state.rents[m] : state.rent;
  state.pay[m] = state.pay[m] || {};
  const entry = { a: Number(a) || 0, t: Date.now() };
  if (img) entry.img = img;
  (state.pay[m][id] = state.pay[m][id] || []).push(entry);
}
const fdate = t => new Date(t).toLocaleString('th-TH', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });

function gotoMonth(m){
  if (!/^\d{4}-\d{2}$/.test(m)) return;
  state.month = m; save(); render();
}
function shift(d){
  const [y, mo] = state.month.split('-').map(Number);
  const dt = new Date(y, mo-1+d, 1);
  gotoMonth(dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0'));
}

function render(){
  try {
    const [y, mo] = state.month.split('-').map(Number);
    $('mlabel').textContent = new Date(y, mo-1, 1).toLocaleDateString('th-TH', { month:'long', year:'numeric' });
    $('month').value = state.month;
    if (document.activeElement !== $('rent')) $('rent').value = curRent();

    const rent = curRent(), ppl = state.people;
    const got = ppl.reduce((s, p) => s + totalOf(p.id), 0);
    $('carry').textContent = fmt(ppl.reduce((s, p) => s + creditIn(p.id, state.month), 0));
    const need = rent * ppl.length;
    const done = ppl.filter(p => totalOf(p.id) >= rent).length;
    $('got').textContent = fmt(got) + ' บาท';
    $('need').textContent = fmt(need);
    $('left').textContent = fmt(Math.max(need - got, 0));
    $('done').textContent = done + '/' + ppl.length;
    $('fill').style.width = need ? Math.min(got / need * 100, 100) + '%' : '0';

    const list = $('list');
    if (!ppl.length){ list.innerHTML = '<div class="empty">ยังไม่มีรายชื่อ เพิ่มคนแรกด้านบนได้เลย</div>'; return; }
    list.innerHTML = '';
    ppl.forEach(p => {
      const paid = paidOf(p.id), cr = creditIn(p.id, state.month), diff = rent - paid - cr, hist = pays(p.id);
      const slipCount = hist.filter(x => x && x.img).length;
      let cls = 't-warn', txt = 'ค้าง ' + fmt(diff) + ' บาท';
      if (diff === 0){ cls = 't-ok'; txt = 'จ่ายครบ'; }
      else if (diff < 0){ cls = 't-over'; txt = 'เกิน ' + fmt(-diff) + ' บาท (ยกไปเดือนหน้า)'; }
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = '<div class="top"><div class="nm"><strong></strong><span>จ่ายแล้ว ' + fmt(paid) + (cr ? ' + ยกมา ' + fmt(cr) : '') + ' จาก ' + fmt(rent) + ' บาท</span></div>'
        + '<span class="tag ' + cls + '">' + txt + '</span>'
        + '<div class="acts"><button type="button" data-a="pay" data-id="' + p.id + '">จ่ายเพิ่ม</button><button type="button" data-a="del" data-id="' + p.id + '" aria-label="ลบคน">ลบ</button></div></div>'
        + '<details' + (openDetails.has(p.id) ? ' open' : '') + ' data-id="' + p.id + '"><summary>ประวัติการจ่าย (' + hist.length + ' ครั้ง' + (slipCount ? ' · มีรูป ' + slipCount : '') + ')</summary><div class="hl"></div></details>';
      const sc = personScore(p.id), rk = rankOf(sc);
      const st = el.querySelector('strong');
      st.textContent = p.name;
      const badge = document.createElement('span');
      badge.className = 'rank';
      badge.textContent = rk.cur.icon + ' ' + rk.cur.name;
      badge.style.color = rk.cur.color;
      st.appendChild(badge);
      const info = document.createElement('span');
      info.className = 'rk';
      info.textContent = 'คะแนน ' + fmt(sc) + ' ' + RANK_UNIT + (rk.next ? ' · อีก ' + fmt(rk.next.min - sc) + ' ' + RANK_UNIT + ' ถึงยศ ' + rk.next.name : ' · ยศสูงสุดแล้ว');
      el.querySelector('.nm').appendChild(info);
      const hl = el.querySelector('.hl');
      if (!hist.length) hl.innerHTML = '<div class="nohist">ยังไม่มีรายการจ่ายในเดือนนี้</div>';
      hist.forEach((x, k) => {
        const r = document.createElement('div');
        r.className = 'h';
        r.innerHTML = '<span class="d"></span><b></b>'
          + (x.img ? '<img class="slip-thumb" alt="สลิปการจ่าย" title="คลิกเพื่อดูรูปเต็ม"><button type="button" data-a="delimg" data-id="' + p.id + '" data-k="' + k + '" aria-label="ลบรูป">ลบรูป</button>' : '')
          + '<button type="button" data-a="rm" data-id="' + p.id + '" data-k="' + k + '" aria-label="ลบรายการนี้">ลบ</button>';
        r.querySelector('.d').textContent = fdate(x.t);
        r.querySelector('b').textContent = '+' + fmt(x.a) + ' บาท';
        if (x.img){
          const thumb = r.querySelector('.slip-thumb');
          thumb.src = x.img;
          thumb.addEventListener('click', () => openLightbox(x.img));
        }
        hl.appendChild(r);
      });
      list.appendChild(el);
    });
  } catch (err) {
    console.error(err);
    setStatus('เกิดข้อผิดพลาดในการแสดงผล: ' + (err && err.message || err));
  }
}

let pendingAddSlipImg = '';
$('addSlip').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file){
    pendingAddSlipImg = '';
    $('addOcrHint').textContent = '';
    return;
  }
  compressImage(file)
    .then(img => {
      pendingAddSlipImg = img;
      return readSlipAmount(img, $('addOcrHint'), $('amt'));
    })
    .catch(err => {
      alert(err.message || 'แนบรูปไม่สำเร็จ');
      $('addSlip').value = '';
      pendingAddSlipImg = '';
      $('addOcrHint').textContent = '';
    });
});

function finishAddPerson(name, a, img){
  const id = uid();
  state.people.push({ id, name });
  if (a > 0 || img) addPay(id, a, img);
  $('name').value = '';
  $('amt').value = 0;
  $('addSlip').value = '';
  $('addOcrHint').textContent = '';
  pendingAddSlipImg = '';
  $('name').focus();
  render();
  save();
}

$('add').addEventListener('click', () => {
  const name = $('name').value.trim();
  if (!name){
    $('name').focus();
    alert('กรุณาใส่ชื่อก่อนครับ');
    return;
  }
  const a = Math.max(0, Number($('amt').value) || 0);
  const file = $('addSlip').files && $('addSlip').files[0];
  if (pendingAddSlipImg){
    finishAddPerson(name, a, pendingAddSlipImg);
    return;
  }
  if (!file){
    finishAddPerson(name, a, '');
    return;
  }
  setStatus('กำลังย่อรูปสลิป...');
  compressImage(file)
    .then(img => finishAddPerson(name, a, img))
    .catch(err => {
      alert(err.message || 'แนบรูปไม่สำเร็จ');
      setStatus('แนบรูปไม่สำเร็จ');
    });
});
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('add').click(); });

function openPayModal(userId){
  const p = state.people.find(x => x.id === userId);
  if (!p) return;
  pendingPayUserId = userId;
  pendingPayImg = '';
  const left = curRent() - totalOf(userId);
  $('payTitle').textContent = 'บันทึกการจ่ายของ ' + p.name;
  $('payAmt').value = left > 0 ? left : 0;
  $('payOcrHint').textContent = '';
  $('paySlip').value = '';
  $('payPreviewImg').src = '';
  $('payPreviewBox').style.display = 'none';
  $('payModal').classList.add('open');
  $('payAmt').focus();
}
function closePayModal(){
  pendingPayUserId = null;
  pendingPayImg = '';
  $('payOcrHint').textContent = '';
  $('payModal').classList.remove('open');
}
$('payCancel').addEventListener('click', closePayModal);
$('payModal').addEventListener('click', e => { if (e.target === $('payModal')) closePayModal(); });
$('paySlip').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file){
    pendingPayImg = '';
    $('payOcrHint').textContent = '';
    $('payPreviewBox').style.display = 'none';
    return;
  }
  compressImage(file)
    .then(img => {
      pendingPayImg = img;
      $('payPreviewImg').src = img;
      $('payPreviewBox').style.display = 'block';
      return readSlipAmount(img, $('payOcrHint'), $('payAmt'));
    })
    .catch(err => {
      alert(err.message || 'แนบรูปไม่สำเร็จ');
      $('paySlip').value = '';
      pendingPayImg = '';
      $('payOcrHint').textContent = '';
      $('payPreviewBox').style.display = 'none';
    });
});
$('paySave').addEventListener('click', () => {
  if (!pendingPayUserId) return;
  const n = Math.max(0, Number($('payAmt').value) || 0);
  if (n <= 0 && !pendingPayImg){
    alert('กรุณากรอกยอดเงินหรือแนบรูปสลิป');
    return;
  }
  addPay(pendingPayUserId, n, pendingPayImg);
  openDetails.add(pendingPayUserId);
  closePayModal();
  render();
  save();
});

$('syncBtn').addEventListener('click', () => {
  setStatus('กำลังซิงก์ข้อมูลล่าสุด...');
  pull(true);
});

$('soundBtn').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  $('soundBtn').textContent = soundEnabled ? '🔔 เสียงเตือน: เปิด' : '🔕 เสียงเตือน: ปิด';
});

$('rent').addEventListener('input', e => {
  const v = Math.max(0, Number(e.target.value)||0);
  state.rents[state.month] = v; state.rent = v;
  render();
  save();
});
$('month').addEventListener('change', e => gotoMonth(e.target.value));
$('prev').addEventListener('click', () => shift(-1));
$('next').addEventListener('click', () => shift(1));
$('list').addEventListener('toggle', e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (id) e.target.open ? openDetails.add(id) : openDetails.delete(id);
}, true);
$('list').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.id, p = state.people.find(x => x.id === id);
  if (!p) return;
  if (b.dataset.a === 'del'){
    if (confirm('ลบ "' + p.name + '" ออกจากรายชื่อ (ลบประวัติทุกเดือนของคนนี้ด้วย)?')){
      state.people = state.people.filter(x => x.id !== id);
      Object.values(state.pay || {}).forEach(m => { if (m && typeof m === 'object') delete m[id]; });
      render();
      save();
    }
  } else if (b.dataset.a === 'rm'){
    const k = Number(b.dataset.k), x = pays(id)[k];
    if (x && confirm('ลบรายการจ่าย ' + fmt(x.a) + ' บาท ของ ' + p.name + '?')){
      state.pay[state.month][id].splice(k, 1);
      render();
      save();
    }
  } else if (b.dataset.a === 'delimg'){
    const k = Number(b.dataset.k), x = pays(id)[k];
    if (x && x.img && confirm('ลบรูปแนบของรายการนี้?')){
      delete x.img;
      render();
      save();
    }
  } else if (b.dataset.a === 'pay'){
    openPayModal(id);
  }
});
$('reset').addEventListener('click', () => {
  if (confirm('ล้างยอดการจ่ายของเดือนนี้ทั้งหมด? (รายชื่อและเดือนอื่นไม่หาย)')){
    delete state.pay[state.month];
    render();
    save();
  }
});

load();
applyBackground();
render();
if (DB_URL){
  pull(true).then(() => { startRealtimeStream(); });
  setInterval(() => pull(false), 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(true); });
  window.addEventListener('focus', () => pull(true));
}
else setStatus('ยังไม่ได้ตั้งค่าออนไลน์ ข้อมูลเก็บในเครื่องนี้เท่านั้น');
</script>
</body>
